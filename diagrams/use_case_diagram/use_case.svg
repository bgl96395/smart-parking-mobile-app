  <text x="96" y="1509" font-size="12.5" fill="#333333">Login (UC-05) is a precondition for every other operator and administrator use case.</text>
  <text x="96" y="1529" font-size="12.5" fill="#333333">UC-18 is included in every use case that changes data, so the audit entry cannot be skipped.</text>
  <text x="96" y="1549" font-size="12.5" fill="#333333">Timer starts UC-16 and UC-17 on a schedule; Partner camera is a secondary actor that supplies images.</text>
